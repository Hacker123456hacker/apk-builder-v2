name: Build approved project
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  deployments: write
concurrency:
  group: ideaforge-main-build
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK if Android project exists
        shell: bash
        run: |
          if [ -d generated/android ]; then
            cd generated/android
            gradle --no-daemon assembleDebug
            mkdir -p ../../dist
            cp app/build/outputs/apk/debug/app-debug.apk ../../dist/IdeaForge-debug.apk
          else
            echo "No Android project has been approved yet."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IdeaForge-Android-APK
          path: dist/*.apk
          if-no-files-found: ignore
          retention-days: 30
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble Pages site
        run: |
          mkdir -p public/assets
          cp index.html public/index.html
          cp -R assets/. public/assets/
          if [ -d generated/web ]; then
            mkdir -p public/project
            cp -R generated/web/. public/project/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
