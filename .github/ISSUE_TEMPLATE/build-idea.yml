name: Build an app or website idea
description: Submit an idea for an AI-generated project draft
title: "Build idea: "
body:
  - type: markdown
    attributes:
      value: "The AI creates a draft pull request. Nothing is built or published until you review and merge it."
  - type: textarea
    id: idea
    attributes:
      label: What should be built?
      description: Describe screens, features, design, and expected behavior.
      placeholder: "I want an app that..."
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Main output
      options:
        - Android APK
        - Website
        - Both Android APK and website
    validations:
      required: true
