name: Build an app or website idea
description: Submit an idea for an AI-generated draft
title: "Build idea: "
labels: ["build-idea"]
body:
  - type: markdown
    attributes:
      value: "Your idea will be reviewed and turned into a draft. No build or publishing happens until you approve it."
  - type: textarea
    id: idea
    attributes:
      label: What should be built?
      description: Describe screens, features, design, and how it should work.
      placeholder: "I want an app that..."
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Main output
      options:
        - Android APK
        - Website
        - Both Android APK and website
    validations:
      required: true
  - type: checkboxes
    id: review
    attributes:
      label: Review
      options:
        - label: I want to review the generated code before any build or publishing.
          required: true
